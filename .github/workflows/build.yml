name: Build executables

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name panfleto-reader main.py

      - name: Package output
        shell: bash
        run: |
          mkdir output
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/panfleto-reader.exe output/panfleto-reader-windows.exe
          else
            mv dist/panfleto-reader output/panfleto-reader-macos
            chmod +x output/panfleto-reader-macos
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panfleto-reader-${{ runner.os }}
          path: output/
